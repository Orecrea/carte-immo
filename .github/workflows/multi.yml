name: Recherche multi-logements (hebdomadaire)

# Une fois par semaine (rendez-vous le lundi à 6 h, heure de Paris) : biens avec deux logements à moins d'une heure de Paris,
# dans des communes équipées (écoles, santé, loisirs). Résultat chiffré dans site/multi.enc, lu par l'onglet « Multi-logements ».
# GitHub saute souvent ses tâches planifiées : on frappe toutes les 2 h, et l'étape « Semaine » ne lance la recherche
# que si celle de la semaine n'a pas encore été faite. Un rendez-vous raté est donc rattrapé dans les 2 h.
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:          # bouton « Run workflow » sur GitHub : relance la recherche tout de suite
    inputs:
      rapide:
        description: "Sans relire les sites : recalcule seulement le tri à partir des annonces déjà lues"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: multi
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    outputs:
      publier: ${{ steps.multi.outputs.publier }}
    steps:
      - name: Semaine
        id: semaine
        env:
          EVT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=1
          if [ "$EVT" = schedule ]; then
            ok=$(python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Paris"))
          lundi = (now - timedelta(days=now.weekday())).replace(hour=6, minute=0, second=0, microsecond=0)
          if lundi > now:
              lundi -= timedelta(days=7)
          out = subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/commits?path=site/multi.enc&per_page=1"], capture_output=True, text=True).stdout
          try:
              maj = datetime.fromisoformat(json.loads(out)[0]["commit"]["committer"]["date"].replace("Z", "+00:00"))
          except Exception:
              maj = None
          print(0 if maj and maj >= lundi else 1)
          PY
            )
            [ "$ok" = 1 ] && echo "Recherche de la semaine à faire : on y va." || echo "Recherche de la semaine déjà faite."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - if: steps.semaine.outputs.ok == '1'
        uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - if: steps.semaine.outputs.ok == '1'
        uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: collecte/requirements.txt}
      - if: steps.semaine.outputs.ok == '1'
        run: pip install -q -r collecte/requirements.txt
      - name: Recherche
        id: multi
        if: steps.semaine.outputs.ok == '1'
        env:
          CLE_CARTE: ${{ secrets.CLE_CARTE }}
          LIMITE_MIN: '170'
          SANS_COLLECTE: ${{ (github.event_name == 'push' || inputs.rapide) && '1' || '' }}
        run: python collecte/multi.py manuel
      - name: Enregistrement
        if: steps.multi.outputs.publier == '1'
        env:
          BRANCHE: ${{ github.ref_name }}
        run: |
          git config user.name "Collecte automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp etat/multi.enc /tmp/etat-multi.enc; cp site/multi.enc /tmp/site-multi.enc
          # repart toujours de la dernière version du dépôt (la collecte des annonces écrit aussi pendant ce temps)
          for i in 1 2 3 4; do
            git fetch -q origin "$BRANCHE" && git reset -q --hard "origin/$BRANCHE"
            cp /tmp/etat-multi.enc etat/multi.enc; cp /tmp/site-multi.enc site/multi.enc
            git add etat/multi.enc site/multi.enc
            git diff --cached --quiet && break
            git commit -qm "Multi-logements : recherche du $(date -u +%d/%m/%Y)" && git push -q origin "HEAD:$BRANCHE" && break
            sleep 7
          done

  publication:
    needs: recherche
    if: needs.recherche.outputs.publier == '1' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Numéro de version des pages (rechargement automatique chez le visiteur)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::12}-${GITHUB_RUN_ID}/" site/index.html site/beta.html site/transports.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploie
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub refuse parfois la publication juste après l'envoi des fichiers : on réessaie après une courte pause
      - if: steps.deploie.outcome == 'failure'
        run: sleep 45
      - if: steps.deploie.outcome == 'failure'
        uses: actions/deploy-pages@v4
