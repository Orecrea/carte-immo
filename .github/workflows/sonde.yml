name: sonde
on: {push: {branches: [sonde], paths: ['.github/workflows/sonde.yml']}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r collecte/requirements.txt
      - env: {CLE_CARTE: '${{ secrets.CLE_CARTE }}'}
        run: |
          python outils/essai_lieu.py
          git config user.name s; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/res.enc && git commit -qm res && git push -q origin HEAD:sonde
# essai 4
