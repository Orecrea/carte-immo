name: Diagnostic multi-logements (temporaire)
on:
  push:
    branches: [claude/project-thread-syehho]
    paths: ['outils/diag_multi.py', 'collecte/multi_detect.py']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - run: python3 outils/diag_multi.py
        env:
          CLE_CARTE: ${{ secrets.CLE_CARTE }}
