name: Collecte des annonces

on:
  schedule:
    # GitHub déclenche ses tâches planifiées avec des heures de retard, et en saute beaucoup (constaté les 24 et 25/11 :
    # seule celle du soir passait). On frappe donc toutes les 30 min, et l'étape « Heure » ne lance la collecte que si
    # le dernier rendez-vous (10 h, 14 h ou 20 h heure de Paris) n'a pas encore eu sa collecte : un rendez-vous raté
    # est rattrapé dans la demi-heure.
    - cron: '7,37 * * * *'
  workflow_dispatch:          # bouton « Run workflow » sur GitHub
  issues:
    types: [opened]           # bouton « Actualiser » de la carte
  push:
    branches: [main]
    paths: ['site/index.html', 'site/beta.html', 'site/transports.html', 'perso/demande.enc']   # demande.enc : bouton « Actualiser » de la carte reliée à GitHub

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    # Une demande « Actualiser » n'est acceptée que si elle vient du propriétaire du dépôt
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Actualiser'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - name: Heure
        id: heure
        env:
          EVT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=1
          if [ "$EVT" = schedule ]; then
            ok=$(python3 - <<'PY'
          import base64, json, os, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          paris = ZoneInfo("Europe/Paris"); now = datetime.now(paris)
          rdv = [now.replace(hour=h, minute=0, second=0, microsecond=0) - timedelta(days=d) for d in (0, 1) for h in (10, 14, 20)]
          dernier = max(r for r in rdv if r <= now)
          api = lambda chemin: subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/{chemin}"], capture_output=True, text=True).stdout
          try:
              fin = datetime.fromisoformat(base64.b64decode(json.loads(api("contents/etat/fin.txt?ref=main"))["content"]).decode().strip())
          except Exception:
              fin = None
          try:
              maj = datetime.fromisoformat(json.loads(api("commits?path=site/annonces.enc&per_page=1"))[0]["commit"]["committer"]["date"].replace("Z", "+00:00"))
          except Exception:
              maj = None
          if fin and now > fin:
              print(0)                                   # collecte automatique en pause (plus d'un mois sans Actualiser)
          elif maj and maj >= dernier:
              print(0)                                   # ce rendez-vous a déjà eu sa collecte
          else:
              print(1)
          PY
            )
            [ "$ok" = 1 ] && echo "Rendez-vous de collecte à rattraper : on y va." || echo "Collecte déjà faite pour ce créneau : rien à faire."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          # envoi de la carte (perso/demande.enc) : on regarde les fichiers vraiment modifiés par ce push
          if [ "$EVT" = push ]; then
            gh api "repos/$REPO/compare/$AVANT...$APRES" --jq '.files[].filename' | grep -qx 'perso/demande.enc' && echo "demande=1" >> "$GITHUB_OUTPUT" || true
          fi
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: collecte/requirements.txt}
      - run: pip install -q -r collecte/requirements.txt

      - name: Collecte
        id: collecte
        if: steps.heure.outputs.ok == '1' && (github.event_name != 'push' || steps.heure.outputs.demande == '1')
        env:
          CLE_CARTE: ${{ secrets.CLE_CARTE }}
          DEMANDE: ${{ github.event.issue.body }}
          PARTIEL: '1'                # annonces publiées au fur et à mesure (perso/partiel.enc)
          DEMANDE_FICHIER: perso/demande.enc   # dernier choix de villes envoyé par la carte, lu à chaque collecte
        run: python collecte/collecte.py ${{ github.event_name == 'schedule' && 'auto' || 'manuel' }}

      - name: Enregistrement
        if: steps.collecte.outputs.publier == '1'
        run: |
          git config user.name "Collecte automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # repart toujours de la dernière version du dépôt : deux collectes à la suite ne se gênent plus
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q origin/main
            git add etat site/annonces.enc
            git diff --cached --quiet && break
            git commit -qm "Annonces du $(date -u +%d/%m/%Y\ %H:%M)" && git push -q origin HEAD:main && break
            sleep 5
          done

      - name: Réponse à la demande
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTAT: ${{ steps.collecte.outputs.resultat || 'La collecte a rencontré un problème, voir le journal de l''action.' }}
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$RESULTAT"

      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Numéro de version des pages (rechargement automatique chez le visiteur)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::12}-${GITHUB_RUN_ID}/" site/index.html site/beta.html site/transports.html
      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        id: deploie
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub refuse parfois la publication juste après l'envoi des fichiers : on réessaie après une courte pause
      - if: steps.deploie.outcome == 'failure'
        run: sleep 30
      - if: steps.deploie.outcome == 'failure'
        id: deploie2
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploie2.outcome == 'failure'
        run: sleep 60
      - if: steps.deploie2.outcome == 'failure'
        uses: actions/deploy-pages@v4
