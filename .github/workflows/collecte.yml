name: Collecte des annonces

on:
  schedule:
    # 10 h 17, 14 h 17 et 20 h 17 heure de Paris (GitHub saute souvent les tâches prévues à l'heure pile) : GitHub ne connaît que l'heure UTC,
    # donc une ligne pour l'heure d'été, une pour l'heure d'hiver ; l'étape « Heure » ne garde que la bonne.
    - cron: '17 8,12,18 * * *'    # heure d'été (UTC+2)
    - cron: '17 9,13,19 * * *'    # heure d'hiver (UTC+1)
  workflow_dispatch:          # bouton « Run workflow » sur GitHub
  issues:
    types: [opened]           # bouton « Actualiser » de la carte
  push:
    branches: [main]
    paths: ['site/index.html', 'site/beta.html', 'site/transports.html', 'perso/demande.enc']   # demande.enc : bouton « Actualiser » de la carte reliée à GitHub

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    # Une demande « Actualiser » n'est acceptée que si elle vient du propriétaire du dépôt
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Actualiser'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - name: Heure
        id: heure
        env:
          PROG: ${{ github.event.schedule }}
        run: |
          ok=1
          if [ -n "$PROG" ]; then
            ete=$([ "$(TZ=Europe/Paris date +%z)" = "+0200" ] && echo 1 || echo 0)
            case "$PROG" in
              '17 8,12,18 * * *') [ "$ete" = 1 ] || ok=0 ;;
              '17 9,13,19 * * *') [ "$ete" = 0 ] || ok=0 ;;
            esac
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = 1 ] || echo "Pas l'heure de Paris prévue (changement d'heure) : collecte sautée."
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: collecte/requirements.txt}
      - run: pip install -q -r collecte/requirements.txt

      - name: Collecte
        id: collecte
        if: steps.heure.outputs.ok == '1' && (github.event_name != 'push' || contains(toJSON(github.event.commits), 'perso/demande.enc'))
        env:
          CLE_CARTE: ${{ secrets.CLE_CARTE }}
          DEMANDE: ${{ github.event.issue.body }}
          DEMANDE_FICHIER: ${{ github.event_name == 'push' && 'perso/demande.enc' || '' }}
        run: python collecte/collecte.py ${{ github.event_name == 'schedule' && 'auto' || 'manuel' }}

      - name: Enregistrement
        if: steps.collecte.outputs.publier == '1'
        run: |
          git config user.name "Collecte automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # repart toujours de la dernière version du dépôt : deux collectes à la suite ne se gênent plus
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q origin/main
            git add etat site/annonces.enc
            git diff --cached --quiet && break
            git commit -qm "Annonces du $(date -u +%d/%m/%Y\ %H:%M)" && git push -q origin HEAD:main && break
            sleep 5
          done

      - name: Réponse à la demande
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTAT: ${{ steps.collecte.outputs.resultat || 'La collecte a rencontré un problème, voir le journal de l''action.' }}
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$RESULTAT"

      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Numéro de version des pages (rechargement automatique chez le visiteur)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::12}-${GITHUB_RUN_ID}/" site/index.html site/beta.html site/transports.html
      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/deploy-pages@v4
