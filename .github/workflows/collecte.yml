name: Collecte des annonces

on:
  schedule:
    - cron: '20 5 * * *'     # vers 6 h 20 (heure de Paris en hiver)
    - cron: '20 16 * * *'    # vers 17 h 20
  workflow_dispatch:          # bouton « Run workflow » sur GitHub
  issues:
    types: [opened]           # bouton « Actualiser » de la carte
  push:
    branches: [main]
    paths: ['site/index.html']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    # Une demande « Actualiser » n'est acceptée que si elle vient du propriétaire du dépôt
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Actualiser'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: collecte/requirements.txt}
      - run: pip install -q -r collecte/requirements.txt

      - name: Collecte
        id: collecte
        if: github.event_name != 'push'
        env:
          CLE_CARTE: ${{ secrets.CLE_CARTE }}
          DEMANDE: ${{ github.event.issue.body }}
        run: python collecte/collecte.py ${{ github.event_name == 'schedule' && 'auto' || 'manuel' }}

      - name: Enregistrement
        if: steps.collecte.outputs.publier == '1'
        run: |
          git config user.name "Collecte automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat site/annonces.enc
          git diff --cached --quiet || git commit -qm "Annonces du $(date -u +%d/%m/%Y\ %H:%M)"
          git pull -q --rebase && git push -q

      - name: Réponse à la demande
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTAT: ${{ steps.collecte.outputs.resultat || 'La collecte a rencontré un problème, voir le journal de l''action.' }}
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$RESULTAT"

      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/configure-pages@v5
      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - if: steps.collecte.outputs.publier == '1' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/deploy-pages@v4
